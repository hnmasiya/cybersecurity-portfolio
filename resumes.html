<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Hazvinei Nomatter Masiya | Resume</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--card:#111827;--border:#263247;--text:#f8fafc;--muted:#94a3b8;--green:#10b981}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,rgba(16,185,129,.08),transparent 42%),var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:32px 18px}main{width:min(720px,100%)}h1{margin:0 0 10px;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}.card{background:rgba(17,24,39,.78);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 16px 40px rgba(0,0,0,.18)}.card h2{margin:0 0 10px;font-size:1.45rem}.card p{color:var(--muted);line-height:1.65;margin:0}.download{margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:9px;background:var(--green);color:#03140e;border:1px solid var(--green);font-weight:700;font-size:.95rem;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>Cybersecurity-first profile</h1>
<section class="card">
<h2>Resume</h2>
<div class="download">
<a id="download" class="btn" href="resume-variants/pdf/global.pdf" target="_blank" rel="noopener">📄 View / Download Resume</a>
</div>
</section>
</main>
<script>
const countryToVariant={
US:"US Resume",CA:"Canadian Resume",GB:"UK CV",IE:"Irish CV",
AU:"Australian Resume",NZ:"New Zealand Resume",
DE:"German CV",FR:"French CV",NL:"Dutch CV",CH:"Swiss CV",
AE:"UAE Resume",QA:"Qatar Resume",SA:"Saudi Arabia Resume",
ZA:"South African CV",ZW:"Zimbabwe CV",NG:"Nigerian CV",KE:"Kenyan CV",
IN:"Indian Resume",SG:"Singapore Resume",JP:"Japan Resume",KR:"South Korea Resume",
BR:"Brazil Resume",MX:"Mexico Resume"
};
function fallbackVariant(code){
 if(regionCountries.europe.has(code)) return "europe";
 if(regionCountries.africa.has(code)) return "africa";
 if(regionCountries.middleEast.has(code)) return "middle-east";
 if(regionCountries.asiaPacific.has(code)) return "asia-pacific";
 return "international";
}
function setResume(code){
 const label=countryToVariant[code]||fallbackVariant(code);
 const slug=label.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
 const link=document.getElementById("download");
 link.href="resume-variants/pdf/"+slug+".pdf";
 link.setAttribute("download","");
}
fetch("https://ipapi.co/country/",{cache:"no-store"})
 .then(r=>r.ok?r.text():Promise.reject(new Error("country lookup failed")))
 .then(code=>setResume(code.trim().toUpperCase()))
 .catch(()=>setResume("ZZ"));
</script>
