    <title>Hazvinei Nomatter Masiya | Cybersecurity Analyst & Security Operations</title>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-body: #080b11;
            --bg-nav: rgba(12, 17, 29, 0.85);
            --bg-card: rgba(18, 26, 43, 0.6);
            --bg-card-hover: rgba(24, 35, 58, 0.85);
            --bg-terminal: #0a0e17;
            --border: #1e293b;
            --border-highlight: #334155;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #a855f7;

            --badge-live: rgba(16, 185, 129, 0.12);
            --badge-synthetic: rgba(6, 182, 212, 0.12);
            --badge-methodology: rgba(168, 85, 247, 0.12);
        }

        :root[data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-nav: rgba(255, 255, 255, 0.85);
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-hover: #ffffff;
            --bg-terminal: #0f172a;
            --border: #e2e8f0;
            --border-highlight: #cbd5e1;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            
            --accent-green: #059669;
            --accent-green-glow: rgba(5, 150, 105, 0.15);
            --accent-blue: #2563eb;
            --accent-cyan: #0891b2;
            --accent-purple: #7c3aed;

            --badge-live: rgba(5, 150, 105, 0.1);
            --badge-synthetic: rgba(8, 145, 178, 0.1);
            --badge-methodology: rgba(124, 58, 237, 0.1);
        }

        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.25s, border-color 0.25s; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Glow */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1000px;
            max-width: 100vw;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, rgba(6, 182, 212, 0.03) 50%, rgba(0,0,0,0) 80%);
            pointer-events: none;
            z-index: 0;
        }



        /* Header Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-nav);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 2rem;
            position: relative;
            z-index: 1;
        }
        .logo {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 1.025rem;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .status-dot {
            width: 9px;
            height: 9px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        nav { display: flex; align-items: center; gap: 1.25rem; }
        nav ul { display: flex; list-style: none; gap: 1.75rem; }
        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
            position: relative;
            padding-bottom: 4px;
        }
        nav a:hover { color: var(--accent-green); }
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--accent-green);
            transition: width 0.2s ease;
        }
        nav a:hover::after { width: 100%; }

        .btn-nav-action {
            background: transparent;
            border: 1px solid var(--border-highlight);
            color: var(--text-secondary);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
        }
        .btn-nav-action:hover { border-color: var(--accent-green); color: var(--accent-green); }

        .container { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem; position: relative; z-index: 1; }

        /* Hero */
        .hero {
            padding: 3.5rem 0 3rem;
            border-bottom: 1px solid var(--border);
        }
        .hero-title {
            font-size: 3.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .hero-subtitle {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--accent-cyan);
            font-size: 1.25rem;
            margin-bottom: 0.4rem;
        }
        .hero-subtitle-secondary {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }
        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 880px;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .section-header {
            margin: 4rem 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.01em;
        }
        .section-title::before {
            content: '//';
            font-family: 'IBM Plex Mono', monospace;
            color: var(--accent-green);
        }

        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1.5rem; }
        .grid-4 > *, .grid-2 > * { min-width: 0; }

        /* Glass Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.25s, box-shadow 0.25s;
            opacity: 1;
        }
        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-highlight);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.4);
        }

        .snapshot-card h4 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.95rem;
            color: var(--accent-green);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .snapshot-card ul { list-style: none; font-size: 0.9rem; color: var(--text-secondary); }
        .snapshot-card li { margin-bottom: 0.5rem; position: relative; padding-left: 1.2rem; }
        .snapshot-card li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-family: 'IBM Plex Mono', monospace;
        }

        .project-badge {
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.725rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-live { background: var(--badge-live); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-synthetic { background: var(--badge-synthetic); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .badge-methodology { background: var(--badge-methodology); color: var(--accent-purple); border: 1px solid var(--accent-purple); }

        .project-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem; }
        
        .metric-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.08);
            border: 1px dashed var(--accent-green);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 0.85rem;
            display: inline-block;
        }

        .project-desc { font-size: 0.925rem; color: var(--text-secondary); margin-bottom: 1rem; line-height: 1.6; }

        /* Terminal Preview Block with Interactive Copy */
        .terminal-preview {
            background: var(--bg-terminal);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            margin-bottom: 1.25rem;
            overflow-x: auto;
            white-space: pre-wrap;
            position: relative;
        }
        .terminal-header {
            color: var(--text-muted);
            font-size: 0.68rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .copy-btn:hover { color: var(--accent-green); }

        .tag-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
        .tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: 'IBM Plex Mono', monospace;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }
        .btn-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.875rem;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            transition: transform 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-link:hover { color: var(--accent-cyan); transform: translateX(3px); }
        
        .btn-quicklook {
            background: transparent;
            border: none;
            color: var(--accent-green);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-quicklook:hover { text-decoration: underline; }

        .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.08);
        }

        .btn-cta-group { display: flex; gap: 1rem; flex-wrap: wrap; }
        .btn-cta {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent-green); color: #000; }
        .btn-primary:hover { opacity: 0.9; box-shadow: 0 0 15px var(--accent-green-glow); transform: translateY(-2px); }
        .btn-outline { background: transparent; color: var(--text-primary); border: 1px solid var(--border-highlight); }
        .btn-outline:hover { border-color: var(--text-primary); transform: translateY(-2px); }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 11, 17, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--bg-body);
            border: 1px solid var(--border-highlight);
            border-radius: 12px;
            max-width: 650px;
            width: 90%;
            padding: 2rem;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem; right: 1.25rem;
            background: transparent; border: none;
            color: var(--text-muted); font-size: 1.5rem; cursor: pointer;
        }



        /* ============================================
           Responsive: Tablet & Mobile
           ============================================ */
        @media (max-width: 768px) {
            .code-snippet { overflow-wrap: anywhere; }

            .nav-container {
                flex-wrap: wrap;
                padding: 0.85rem 1.25rem;
                row-gap: 0.6rem;
            }
            .logo { font-size: 0.85rem; white-space: nowrap; }
            nav {
                width: 100%;
                flex-wrap: wrap;
                justify-content: flex-start;
                gap: 0.6rem 1rem;
            }
            nav ul {
                width: 100%;
                flex-wrap: wrap;
                gap: 0.5rem 1.1rem;
            }

            .container { padding: 1.5rem 1.25rem; }
            .hero { padding: 2rem 0 1.5rem; }
            .hero-title { font-size: 2.1rem; }
            .hero-subtitle { font-size: 1.05rem; }
            .hero-subtitle-secondary { font-size: 0.85rem; }
            .hero-meta { gap: 0.85rem 1.25rem; }
            .hero-desc { font-size: 1rem; }

            .btn-cta-group { flex-direction: column; align-items: stretch; }
            .btn-cta { justify-content: center; width: 100%; }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
                margin: 2.5rem 0 1.5rem;
            }
            .section-title { font-size: 1.4rem; }
            .filter-group { width: 100%; }
            .filter-btn { flex: 1 1 auto; text-align: center; }

            .card { padding: 1.25rem; }
            .grid-2, .grid-4 { gap: 1rem; }

            .card-footer { flex-wrap: wrap; gap: 0.75rem; }


        // Copy Terminal Snippets
        function copyTerminal(btn) {
            let snippet = btn.closest('.terminal-preview').querySelector('.code-snippet').innerText;
            navigator.clipboard.writeText(snippet).then(() => {
                btn.innerText = "Copied!";
                btn.style.color = "var(--accent-green)";
                setTimeout(() => {
                    btn.innerText = "Copy";
                    btn.style.color = "var(--text-muted)";
                }, 2000);
            });
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
        }

        function filterWork(cat, evt) {
            const items = document.querySelectorAll('.project-item');
            const btns = document.querySelectorAll('.filter-btn');
            
            btns.forEach(b => b.classList.remove('active'));
            evt.target.classList.add('active');

            items.forEach(item => {
                if (cat === 'all' || item.getAttribute('data-category') === cat) {
                    item.style.opacity = '0';
                    item.style.display = 'flex';
                    setTimeout(() => { item.style.opacity = '1'; }, 50);
                } else {
                    item.style.opacity = '0';
                    setTimeout(() => { item.style.display = 'none'; }, 200);
                }
            });
        }

        // Overview Modal
        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modal').style.display = 'flex';
        }
        function hideModal() { document.getElementById('modal').style.display = 'none'; }
        function closeModal(e) { if (e.target.classList.contains('modal-overlay')) hideModal(); }

        // Auto-synced public GitHub project index
        async function loadAutoSyncedProjects() {
            const grid = document.getElementById('auto-project-grid');
            if (!grid) return;
            try {
                const response = await fetch('portfolio-projects.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('Project index unavailable');
                const data = await response.json();
                const projects = Array.isArray(data.projects) ? data.projects : [];
                if (!projects.length) {
                    grid.innerHTML = '<div class="card"><p>No public GitHub projects are currently indexed.</p></div>';
                    return;
                }
                grid.innerHTML = projects.map(project => {
                    const safeName = String(project.name || 'Project').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                    const safeDescription = String(project.description || 'No repository description provided.').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                    const safeUrl = String(project.url || '#');
                    return '<div class="card project-item" data-category="github"><div><h3 class="project-title">' + safeName + '</h3><p class="project-desc">' + safeDescription + '</p></div><div class="card-footer"><a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer" class="btn-link">View Repository →</a></div></div>';
                }).join('');
            } catch (error) {
                grid.innerHTML = '<div class="card"><p>GitHub project index is temporarily unavailable. The portfolio repository remains the source of record.</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadAutoSyncedProjects);
    </script>
