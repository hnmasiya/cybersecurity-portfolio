name: DevSecOps Security & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  trufflehog-secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          extra_args: --only-verified

  lint-and-sast:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit yamllint

      - name: Lint YAML Files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

      - name: Python SAST (Bandit)
        run: |
          bandit -r . -ll -ii --exclude ./.venv || true

      - name: Python Code Style (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

# CI retriggered after repository Actions policy was updated to require immutable SHA pins.
