name: Validate Automatic Country Resumes

on:
  pull_request:
    branches: [main]
    paths:
      - 'Resume_Hazvinei_Masiya.md'
      - 'resume-variants/country-profiles.json'
      - 'scripts/build-resume-variants.py'
      - 'scripts/validate-resume-pages.py'
      - '.github/workflows/validate-country-resumes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate country and fallback variants
        run: python3 scripts/build-resume-variants.py

      - name: Install PDF build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Build PDFs
        run: |
          set -euo pipefail
          rm -rf dist/resumes/pdf
          mkdir -p dist/resumes/pdf
          for file in dist/resumes/*.md; do
            libreoffice --headless --convert-to pdf --outdir dist/resumes/pdf "$file"
          done
          count="$(find dist/resumes/pdf -maxdepth 1 -name '*.pdf' | wc -l)"
          echo "[INFO] Generated $count PDFs"
          test "$count" -ge 20

      - name: Enforce exactly two pages
        run: python3 scripts/validate-resume-pages.py dist/resumes/pdf --expected 2
