name: Publication Boundary

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  publication-boundary:
    name: publication-boundary
    runs-on: ubuntu-latest
    steps:
      - name: Require private-dev promotion PR
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          echo "Head repository: $HEAD_REPO"
          echo "Head branch:     $HEAD_BRANCH"
          echo "PR author:       $PR_AUTHOR"

          test "$HEAD_REPO" = "hnmasiya/cybersecurity-portfolio" || {
            echo "::error::Public production accepts changes only through the controlled promotion repository."
            exit 1
          }

          case "$HEAD_BRANCH" in
            promotion/dev-*) ;;
            *)
              echo "::error::Public production PRs must originate from a promotion/dev-* branch."
              exit 1
              ;;
          esac

          test "$PR_AUTHOR" = "hnmasiya" || {
            echo "::error::Public production PRs must be created by the trusted promotion identity."
            exit 1
          }

          echo "[PASS] Private-first publication boundary satisfied."
