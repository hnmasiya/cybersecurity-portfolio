name: Publication Boundary

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  publication-boundary:
    name: publication-boundary
    runs-on: ubuntu-latest
    steps:
      - name: Require private-dev promotion PR
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          echo "Head repository: $HEAD_REPO"
          echo "Head branch:     $HEAD_BRANCH"
          echo "PR author:       $PR_AUTHOR"

          test "$HEAD_REPO" = "hnmasiya/cybersecurity-portfolio" || {
            echo "::error::Public production accepts changes only through the controlled promotion repository."
            exit 1
          }

          # The promotion workflow authenticates with the configured production
          # repository token, so GitHub records the PR author as the token owner.
          # The branch name remains the automation-generated publication marker.
          if [[ "$HEAD_BRANCH" == "infrastructure/private-first-publication" || "$HEAD_BRANCH" == "infrastructure/fix-publication-boundary" ]]; then
            test "$PR_AUTHOR" = "hnmasiya" || {
              echo "::error::Only the repository owner may maintain the publication-boundary control."
              exit 1
            }
          else
            test "$HEAD_BRANCH" = promotion/dev-* || {
              echo "::error::Non-infrastructure production PRs must use promotion/dev-* branches."
              exit 1
            }
            test "$PR_AUTHOR" = "hnmasiya" || {
              echo "::error::Promotion PRs must be created by the configured production automation identity."
              exit 1
            }
          fi

          echo "[PASS] Private-first publication boundary satisfied."
