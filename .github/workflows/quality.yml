name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required portfolio structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d Forage
          test -f forage.html
          echo "Required portfolio structure is present."
      - name: Detect obvious placeholder text
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'TODO[[:space:]]*:|REPLACE_ME|YOUR_API_KEY|YOUR_SECRET' -- ':!*.lock'; then
            echo "Obvious placeholder text detected."
            exit 1
          fi
