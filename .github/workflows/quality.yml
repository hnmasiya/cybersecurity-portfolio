name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Validate public repository contract
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f index.html
          test -f CNAME
          test -f Resume_Hazvinei_Masiya.md
          test -f resumes.html

          domain="$(tr -d '[:space:]' < CNAME)"
          test "$domain" = "masiya-hub.org"

          if grep -RniE 'Claude-Session:|noreply@anthropic\.com|career-operations-private|AUTOMATION_SIGNING_KEY|PRODUCTION_REPO_TOKEN' .             --exclude-dir=.git             --exclude='*.pdf'; then
            echo "[FAIL] Private development metadata detected in public text."
            exit 1
          fi

          echo "[PASS] Public repository contract validated."
