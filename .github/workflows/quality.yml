name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Validate public repository contract
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f index.html
          test -f CNAME
          test -f resume-variants/pdf/international.pdf
          test -f resumes.html

          domain="$(tr -d '[:space:]' < CNAME)"
          test "$domain" = "masiya-hub.org"

          if grep -RniE 'Co-Authored-By:[[:space:]]*Claude|claude\.ai/|noreply@anthropic\.com' . \
            --exclude-dir=.git \
            --exclude='*.pdf' \
            --exclude='quality.yml'; then
            echo "[FAIL] AI/development metadata detected in public text."
            exit 1
          fi

          if grep -RniE '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b|\+263[[:space:]-]?[0-9]{2}[[:space:]-]?[0-9]{3}[[:space:]-]?[0-9]{4}' . \
            --exclude-dir=.git \
            --exclude='*.pdf' \
            --exclude='quality.yml'; then
            echo "[FAIL] Private contact information detected in public text."
            exit 1
          fi

          echo "[PASS] Public repository contract validated."
