name: Auto-Build Cybersecurity Resume & Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'Resume_Hazvinei_Masiya.md'
      - 'resumes.html'
      - '.github/workflows/auto-update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cybersecurity-resume-build
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Configure verified commit signing
        env:
          AUTOMATION_SIGNING_KEY: ${{ secrets.AUTOMATION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUTOMATION_SIGNING_KEY"
          install -d -m 700 "$RUNNER_TEMP/automation-signing"
          printf '%s\n' "$AUTOMATION_SIGNING_KEY" > "$RUNNER_TEMP/automation-signing/id_ed25519"
          chmod 600 "$RUNNER_TEMP/automation-signing/id_ed25519"
          git config --global gpg.format ssh
          git config --global user.signingkey "$RUNNER_TEMP/automation-signing/id_ed25519"
          git config --global commit.gpgsign true

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Build Consolidated Cybersecurity Resume PDF
        run: |
          set -e
          if [ -f "Resume_Hazvinei_Masiya.md" ]; then
            libreoffice --headless --convert-to pdf --outdir . "Resume_Hazvinei_Masiya.md"
          else
            echo "Missing resume source: Resume_Hazvinei_Masiya.md"
            exit 1
          fi
          mv -f Resume_Hazvinei_Masiya.pdf Resume_Cybersecurity_SOC.pdf

      - name: Ensure Homepage Uses Single Resume
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<a href="https://masiya-hub.org/Resume_Hazvinei_Masiya.pdf" class="btn-cta btn-outline" target="_blank">📄 Resume</a>'
          new = '<a href="Resume_Cybersecurity_SOC.pdf" class="btn-cta btn-outline" target="_blank" rel="noopener">📄 Resume</a>'
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit and Open PR for Updated Resume Asset
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -e
          git config user.name "Hazvinei Nomatter Masiya"
          git config user.email "norman.masiya@gmail.com"

          git add Resume_Cybersecurity_SOC.pdf index.html resumes.html Resume_Hazvinei_Masiya.md .github/workflows/auto-update.yml

          if git diff --cached --quiet; then
            echo "[PASS] Consolidated cybersecurity resume is already up to date."
            exit 0
          fi

          OPEN_RESUME_PRS="$(gh pr list --repo "${{ github.repository }}" --base main --state open --search "in:title \"auto: publish consolidated cybersecurity resume\"" --json number --jq 'length')"
          if [[ "$OPEN_RESUME_PRS" -gt 0 ]]; then
            echo "[PASS] A consolidated-resume PR is already open; skipping duplicate PR creation."
            exit 0
          fi

          OPEN_RESUME_PRS="$(gh pr list --repo "${{ github.repository }}" --base main --state open --search "in:title \"auto: publish consolidated cybersecurity resume\"" --json number --jq 'length')"
          if [[ "$OPEN_RESUME_PRS" -gt 0 ]]; then
            echo "[PASS] Consolidated-resume PR already open; skipping duplicate."
            exit 0
          fi

          BRANCH="auto/cybersecurity-resume-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -S -m "auto: publish consolidated cybersecurity resume"
          git push origin "$BRANCH"

          SHA="$(git rev-parse HEAD)"
          VERIFIED="false"
          for _ in 1 2 3 4 5; do
            VERIFIED="$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.commit.verification.verified' 2>/dev/null || echo false)"
            [[ "$VERIFIED" == "true" ]] && break
            sleep 2
          done
          [[ "$VERIFIED" == "true" ]] || { echo "[FAIL] GitHub did not verify the automation commit signature."; exit 1; }

          PR_URL=$(gh pr create --base main --head "$BRANCH"             --title "auto: publish consolidated cybersecurity resume"             --body "Automated build of the single cybersecurity-first resume PDF, integrating verified enterprise IT and infrastructure experience and removing the separate IT Support & Infrastructure resume." )

          for i in $(seq 1 10); do
            if gh pr checks "$PR_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

          gh pr checks "$PR_URL" --watch --fail-fast
          echo "PR created successfully. Manual approval is required before merge."
