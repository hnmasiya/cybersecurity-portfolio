name: Auto-Build Resumes & Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'Resume_Hazvinei_Masiya.md'
      - 'Resume_IT_Support_Infrastructure.md'
      - 'resumes.html'
      - '.github/workflows/auto-update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-automation
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Build Both Resume PDFs
        run: |
          set -e
          for resume in Resume_Hazvinei_Masiya.md Resume_IT_Support_Infrastructure.md; do
            if [ -f "$resume" ]; then
              libreoffice --headless --convert-to pdf --outdir . "$resume"
            else
              echo "Missing resume source: $resume"
              exit 1
            fi
          done
          mv -f Resume_Hazvinei_Masiya.pdf Resume_Cybersecurity_SOC.pdf

      - name: Add Two-Resume Selector to Homepage
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<a href="https://masiya-hub.org/Resume_Hazvinei_Masiya.pdf" class="btn-cta btn-outline" target="_blank">📄 Resume</a>'
          new = '<a href="resumes.html" class="btn-cta btn-outline" target="_blank">📄 Resumes</a>'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'href="resumes.html"' not in text:
              raise SystemExit('Could not find the existing Resume CTA or an existing resumes.html link.')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit, Open PR, and Merge Updated Resume Assets
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -e
          git config user.name "Hazvinei Nomatter Masiya"
          git config user.email "norman.masiya@gmail.com"

          git add Resume_Cybersecurity_SOC.pdf Resume_IT_Support_Infrastructure.pdf index.html resumes.html Resume_Hazvinei_Masiya.md Resume_IT_Support_Infrastructure.md .github/workflows/auto-update.yml

          if git diff --cached --quiet; then
            echo "[PASS] Resume assets and homepage are already up to date."
            exit 0
          fi

          BRANCH="auto/two-resumes-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "auto: publish two recruiter-ready resumes"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "auto: publish two recruiter-ready resumes" \
            --body "Automated build of the IT Support & Infrastructure and Cybersecurity & SOC PDFs, plus the recruiter-facing two-resume selector on the portfolio homepage." )

          for i in $(seq 1 10); do
            if gh pr checks "$PR_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --squash --delete-branch
