name: Auto-Build Resume & Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'Resume_Hazvinei_Masiya.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-automation
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Convert Resume Markdown to PDF
        run: |
          if [ -f "Resume_Hazvinei_Masiya.md" ]; then
            libreoffice --headless --convert-to pdf \
              --outdir . \
              Resume_Hazvinei_Masiya.md
          else
            echo "Resume markdown not found."
            exit 1
          fi

      - name: Commit and Push Updated Resume PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Resume_Hazvinei_Masiya.pdf

          if git diff --cached --quiet; then
            echo "[PASS] Resume PDF is already up to date."
            exit 0
          fi

          git commit -m "auto: build updated resume PDF [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
