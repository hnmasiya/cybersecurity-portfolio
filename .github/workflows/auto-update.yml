name: Auto-Build Resume & Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'Resume_Hazvinei_Masiya.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-automation
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Convert Resume Markdown to PDF
        run: |
          if [ -f "Resume_Hazvinei_Masiya.md" ]; then
            libreoffice --headless --convert-to pdf \
              --outdir . \
              Resume_Hazvinei_Masiya.md
          else
            echo "Resume markdown not found."
            exit 1
          fi

      - name: Commit, Open PR, and Merge Updated Resume PDF
        env:
          # A PR opened with the default GITHUB_TOKEN is attributed to
          # github-actions[bot], and GitHub holds pull_request-triggered
          # check runs on a bot-opened PR for manual approval even in the
          # PR's own (non-fork) repo - confirmed by actually running this
          # workflow and seeing every check sit at "action_required". A
          # PAT from a real collaborator avoids that gate entirely.
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Resume_Hazvinei_Masiya.pdf

          if git diff --cached --quiet; then
            echo "[PASS] Resume PDF is already up to date."
            exit 0
          fi

          # main requires PRs with passing status checks - a direct push is
          # rejected by branch protection, so this opens a PR and waits for
          # its checks instead. Commit message intentionally has no
          # [skip ci]: skipping CI would mean the required checks never
          # report, and the merge below would hang waiting for them.
          BRANCH="auto/resume-pdf-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "auto: build updated resume PDF"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "auto: build updated resume PDF" \
            --body "Automated rebuild of \`Resume_Hazvinei_Masiya.pdf\` from the updated \`Resume_Hazvinei_Masiya.md\`.")

          # `gh pr checks --watch` exits immediately with "no checks
          # reported" if called before GitHub has registered any check
          # runs for the new commit yet - a short race right after push.
          # Poll until at least one check shows up before handing off to
          # --watch, instead of a single fixed sleep that could still lose
          # the race under load.
          for i in $(seq 1 10); do
            if gh pr checks "$PR_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --squash --delete-branch
