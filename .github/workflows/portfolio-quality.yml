name: Portfolio Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Python syntax validation
        run: |
          python -m compileall -q             Endpoint-Security             Security-Automation             SIEM             Threat-Hunting             Scripts

      - name: Portfolio quality
        run: python Scripts/portfolio_quality_check.py

      - name: Windows Sysmon offline validation
        run: python Endpoint-Security/Windows-Sysmon-Detection-Lab/Scripts/offline_endpoint_validator.py

      - name: Threat hunting offline validation
        run: python Threat-Hunting/Detection-Validation-Lab/Scripts/offline_hunt_validator.py

      - name: Public secret assignment scan
        run: |
          if git grep -nEI             'INDEXER_PASSWORD=|API_PASSWORD=|DASHBOARD_PASSWORD='             -- ':!REPORT-BACKUPS/*' ':!UPGRADED-SOC-REPORT-DRAFTS/*' ':!Documentation-Archive/*'; then
            echo "Potential credential assignment found"
            exit 1
          fi
