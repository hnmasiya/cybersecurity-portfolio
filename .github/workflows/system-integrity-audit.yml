name: System Integrity Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Labs/**"
      - "resume-variants/**"
      - "README.md"
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: system-integrity-audit
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate public repository boundary
        run: |
          set -euo pipefail
          test "$(curl --fail --silent https://api.github.com/repos/$GITHUB_REPOSITORY | python -c 'import json,sys; print(json.load(sys.stdin)["visibility"])')" = "public"
          f=.github/workflows/publication-boundary.yml
          grep -Fq 'pull_request_target' "$f"
          grep -Fq 'promotion/dev-*' "$f"
          grep -Fq 'hnmasiya/cybersecurity-portfolio' "$f"
          grep -Fq 'PR_AUTHOR' "$f"
          echo "[PASS] Public repository and publication boundary verified."

      - name: Validate open PR policy
        run: |
          set -euo pipefail
          curl --fail --silent "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" -o /tmp/open-prs.json
          python - <<'PY'
          import json
          prs=json.load(open("/tmp/open-prs.json"))
          for pr in prs:
              repo=pr["head"]["repo"]["full_name"]
              branch=pr["head"]["ref"]
              author=pr["user"]["login"]
              if repo != "hnmasiya/cybersecurity-portfolio" or not branch.startswith("promotion/dev-") or author != "hnmasiya":
                  raise SystemExit(f"Non-compliant open production PR: #{pr['number']}")
          print("[PASS] All open production PRs, if any, satisfy promotion policy.")
          PY

      - name: Validate public artifact directories
        run: |
          set -euo pipefail
          test -d Labs
          test -d resume-variants
          test -f .github/workflows/publication-boundary.yml
          echo "[PASS] Public artifact and boundary structure verified."

      - name: Audit result
        run: |
          echo "SYSTEM_INTEGRITY_AUDIT=PASS"
          echo "AUDITED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
