name: System Integrity Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Labs/**"
      - "resume-variants/**"
      - "README.md"
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: system-integrity-audit
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate public repository boundary
        env:
          GH_TOKEN: $GITHUB_TOKEN
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY --jq '.visibility')" = "public"
          f=.github/workflows/publication-boundary.yml
          grep -Fq 'pull_request_target' "$f"
          grep -Fq 'promotion/dev-*' "$f"
          grep -Fq 'hnmasiya/cybersecurity-portfolio' "$f"
          grep -Fq 'PR_AUTHOR' "$f"
          echo "[PASS] Public repository and publication boundary verified."

      - name: Validate open PR policy
        env:
          GH_TOKEN: $GITHUB_TOKEN
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName,headRepository,author --jq '.[] | [.number,.headRefName,.headRepository.fullName,.author.login] | @tsv' > /tmp/open-prs
          while IFS=$'\t' read -r number branch repo author; do
            [ -n "$number" ] || continue
            test "$repo" = "$GITHUB_REPOSITORY"
            case "$branch" in promotion/dev-*) ;; *) echo "::error::Non-promotion PR #$number is open."; exit 1;; esac
            test "$author" = "hnmasiya"
          done < /tmp/open-prs
          echo "[PASS] All open production PRs, if any, satisfy promotion policy."

      - name: Validate public artifact directories
        run: |
          set -euo pipefail
          test -d Labs
          test -d resume-variants
          test -f .github/workflows/publication-boundary.yml
          echo "[PASS] Public artifact and boundary structure verified."

      - name: Audit result
        run: |
          echo "SYSTEM_INTEGRITY_AUDIT=PASS"
          echo "AUDITED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
