name: Detection as Code Tests

on:
  pull_request:
    paths:
      - "SOC/Detection-as-Code/**"
      - ".github/workflows/detection-as-code-tests.yml"
  push:
    branches: [main]
    paths:
      - "SOC/Detection-as-Code/**"
      - ".github/workflows/detection-as-code-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run detection regression tests
        working-directory: SOC/Detection-as-Code
        run: python -m unittest discover -s Tests -v
      - name: Validate synthetic fixture format
        working-directory: SOC/Detection-as-Code
        run: python -m json.tool fixtures/synthetic-process-events.json > /dev/null
