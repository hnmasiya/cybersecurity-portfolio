name: Career Intelligence

on:
  schedule:
    - cron: '15 6 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'career/**'
      - 'scripts/job_intelligence.py'
      - 'scripts/tailoring_brief.py'
      - '.github/workflows/career-intelligence.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: career-intelligence
  cancel-in-progress: false

jobs:
  job-discovery:
    name: Global Cybersecurity Job Discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Collect and filter jobs
        run: python scripts/job_intelligence.py
      - name: Upload job reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cybersecurity-job-intelligence
          path: career/reports/
      - name: Publish current job report
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp career/reports/jobs-$(date -u +%Y-%m-%d).md career/latest-jobs.md
          git config user.name 'career-intelligence-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add career/latest-jobs.md
          git diff --cached --quiet && exit 0
          branch="auto/career-intelligence-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git commit -m 'auto: update cybersecurity job intelligence'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'auto: update cybersecurity job intelligence' --body 'Automated job-discovery report update. Sources are public job APIs; verify the original employer/ATS posting before applying.'

