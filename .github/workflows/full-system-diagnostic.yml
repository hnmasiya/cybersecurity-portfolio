name: Execute Full System Diagnostic

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    name: Execute Full System Diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git fsck --no-progress --full
          git diff --check
      - name: Validate HTML structure
        shell: bash
        run: |
          set -euo pipefail
          test -s forage.html
          grep -q '<html' forage.html
          grep -q '</html>' forage.html
          echo "Portfolio HTML structure passed."
      - name: Verify workflow files are valid YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML unavailable; workflow files will be syntax-checked as text.")
              sys.exit(0)
          for p in Path(".github/workflows").glob("*.yml"):
              with p.open(encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"Validated {p}")
          PY
