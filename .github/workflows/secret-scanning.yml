name: Secret Scanning (TruffleHog)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -v "$GITHUB_WORKSPACE:/tmp"             -w /tmp             ghcr.io/trufflesecurity/trufflehog:3.97.5             git file:///tmp             --fail             --no-update             --github-actions             --results=verified,unknown
