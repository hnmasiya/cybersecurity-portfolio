name: Secret Scanning (TruffleHog)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked text files for high-confidence secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----|xox[baprs]-[0-9A-Za-z-]{10,}' -- . ':!*.md' ':!*.html' ':!*.svg'; then
            echo "Potential secret pattern detected."
            exit 1
          fi
          echo "No high-confidence secret patterns detected."
