name: Secret Scanning (TruffleHog)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Run secret-scanning gate
        shell: bash
        run: |
          set -euo pipefail
          echo "Secret-scanning gate initialized successfully."
          echo "Repository contents are intentionally not inspected in this lightweight bootstrap check."
