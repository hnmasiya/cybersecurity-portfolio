name: Secret Scanning (TruffleHog)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked credentials
        uses: trufflesecurity/trufflehog@0186870afd2c4a90def791d80260923ba583d076 # verified upstream main commit
        with:
          extra_args: --results=verified,unknown
