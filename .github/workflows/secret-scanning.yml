name: Secret Scanning (TruffleHog)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan pull request changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/tmp" \
            -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:3.97.5 \
            git file:///tmp \
            --since-commit "${{ github.event.pull_request.base.sha }}" \
            --branch "${{ github.event.pull_request.head.sha }}" \
            --fail \
            --no-update \
            --github-actions \
            --results=verified,unknown

      - name: Scan current production tree
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$RUNNER_TEMP/portfolio-scan"
          mkdir -p "$scan_dir"
          git archive --format=tar HEAD | tar -x -C "$scan_dir"
          docker run --rm \
            -v "$scan_dir:/scan:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.97.5 \
            filesystem /scan \
            --fail \
            --no-update \
            --github-actions \
            --results=verified,unknown
