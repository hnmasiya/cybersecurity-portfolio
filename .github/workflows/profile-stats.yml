name: Dynamic Lab Activity Updater

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-automation
  cancel-in-progress: false

jobs:
  update-readme-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Generate Activity Section
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text()

          start_marker = "<!-- START_SECTION:activity -->"
          end_marker = "<!-- END_SECTION:activity -->"

          if start_marker not in content or end_marker not in content:
              raise SystemExit(
                  "ERROR: README activity markers are missing."
              )

          # The public activity feed must never expose tooling/vendor
          # attribution or branch names from AI-assisted maintenance work.
          # Keep Git history intact; only filter what is published here.
          blocked_terms = re.compile(
              r"(?i)(?:^|[^a-z0-9])(claude|anthropic|chatgpt|openai|gemini|copilot|github\s+copilot|cursor|codeium|tabnine|perplexity|mistral|grok|deepseek|windsurf)(?:$|[^a-z0-9])"
          )

          log_output = subprocess.check_output(
              [
                  "git",
                  "log",
                  "-n",
                  "50",
                  "--pretty=format:%s%x09%cr"
              ],
              text=True
          ).strip()

          safe_entries = []
          for entry in log_output.splitlines():
              subject, relative_time = entry.split("\t", 1)

              # Do not publish AI/tool references, nor this workflow's own
              # maintenance commits, which would otherwise pollute the feed
              # and can cause unnecessary activity-feed churn.
              if blocked_terms.search(subject):
                  continue
              if subject.strip().lower() == "auto: update dynamic lab activity feed":
                  continue

              safe_entries.append(f"* {subject} ({relative_time})")
              if len(safe_entries) == 5:
                  break

          if not safe_entries:
              raise SystemExit(
                  "ERROR: No safe activity entries were found."
              )

          log_output = "\n".join(safe_entries)

          new_section = (
              f"{start_marker}\n"
              f"### Recent Lab & Security Updates\n"
              f"{log_output}\n"
              f"{end_marker}"
          )

          pattern = re.compile(
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker),
              re.DOTALL
          )

          updated_content = pattern.sub(new_section, content)

          if updated_content == content:
              print("[PASS] Activity feed already current and AI-clean.")
          else:
              path.write_text(updated_content)
              print("[PASS] Activity feed updated with safe entries only.")
          PY

      - name: Commit, Open PR, and Merge
        env:
          # A PR opened with the default GITHUB_TOKEN is attributed to
          # github-actions[bot], and GitHub holds pull_request-triggered
          # check runs on a bot-opened PR for manual approval even in the
          # PR's own (non-fork) repo - confirmed by actually running this
          # workflow and seeing every check sit at "action_required". A
          # PAT from a real collaborator avoids that gate entirely.
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "[PASS] No README activity changes required."
            exit 0
          fi

          # main requires PRs with passing status checks - a direct push is
          # rejected by branch protection, so this opens a PR and waits for
          # its checks instead. Commit message intentionally has no
          # [skip ci]: skipping CI would mean the required checks never
          # report, and the merge below would hang waiting for them.
          BRANCH="auto/activity-feed-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "auto: update dynamic lab activity feed"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "auto: update dynamic lab activity feed" \
            --body "Automated update of the README activity feed from the 5 most recent safe commits on \`main\`, excluding AI/tool/vendor attribution and this workflow's own maintenance commit.")

          # `gh pr checks --watch` exits immediately with "no checks
          # reported" if called before GitHub has registered any check
          # runs for the new commit yet - a short race right after push.
          for i in $(seq 1 10); do
            if gh pr checks "$PR_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done

          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --squash --delete-branch
