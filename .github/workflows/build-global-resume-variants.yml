name: Build and Publish Automatic Country Resume Variants

on:
  push:
    branches: [main]
    paths:
      - 'Resume_Hazvinei_Masiya.md'
      - 'resume-variants/country-profiles.json'
      - 'scripts/build-resume-variants.py'
      - 'scripts/validate-resume-pages.py'
      - '.github/workflows/build-global-resume-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-country-resume-variants
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Configure verified commit signing
        env:
          AUTOMATION_SIGNING_KEY: ${{ secrets.AUTOMATION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUTOMATION_SIGNING_KEY"
          install -d -m 700 "$RUNNER_TEMP/automation-signing"
          printf '%s\n' "$AUTOMATION_SIGNING_KEY" > "$RUNNER_TEMP/automation-signing/id_ed25519"
          chmod 600 "$RUNNER_TEMP/automation-signing/id_ed25519"
          git config --global gpg.format ssh
          git config --global user.signingkey "$RUNNER_TEMP/automation-signing/id_ed25519"
          git config --global commit.gpgsign true

      - name: Generate country and fallback variants
        run: python3 scripts/build-resume-variants.py

      - name: Install PDF build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      - name: Build PDFs
        run: |
          set -euo pipefail
          rm -rf dist/resumes/pdf
          mkdir -p dist/resumes/pdf
          for file in dist/resumes/*.md; do
            libreoffice --headless --convert-to pdf --outdir dist/resumes/pdf "$file"
          done
          count="$(find dist/resumes/pdf -maxdepth 1 -name '*.pdf' | wc -l)"
          echo "[INFO] Generated $count PDFs"
          test "$count" -ge 20

      - name: Enforce exactly two pages
        run: python3 scripts/validate-resume-pages.py dist/resumes/pdf --expected 2

      - name: Publish validated PDFs through PR
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          mkdir -p resume-variants/pdf
          cp -f dist/resumes/pdf/*.pdf resume-variants/pdf/
          git config user.name "Hazvinei Nomatter Masiya"
          git config user.email "norman.masiya@gmail.com"
          git add resume-variants/pdf/*.pdf

          if git diff --cached --quiet; then
            echo "[PASS] All validated country resume PDFs are already published."
            exit 0
          fi

          OPEN_PRS="$(gh pr list --repo "${{ github.repository }}" --base main --state open --search 'in:title "auto: publish country resume variants"' --json number --jq 'length')"
          if [[ "$OPEN_PRS" -gt 0 ]]; then
            echo "[PASS] Country-resume publication PR already open; skipping duplicate."
            exit 0
          fi

          BRANCH="auto/country-resume-variants-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -S -m "auto: publish country resume variants"
          git push origin "$BRANCH"

          SHA="$(git rev-parse HEAD)"
          VERIFIED="false"
          for _ in 1 2 3 4 5; do
            VERIFIED="$(gh api "repos/${{ github.repository }}/commits/$SHA" --jq '.commit.verification.verified' 2>/dev/null || echo false)"
            [[ "$VERIFIED" == "true" ]] && break
            sleep 2
          done
          [[ "$VERIFIED" == "true" ]] || { echo "[FAIL] Automation commit signature was not verified."; exit 1; }

          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "auto: publish country resume variants" --body "Automated publication of validated country and regional resume PDFs generated from the verified master resume. Every PDF passed the exact two-page quality gate.")"

          for i in $(seq 1 30); do
            CHECKS_OUTPUT="$(gh pr checks "$PR_URL" 2>&1 || true)"
            if ! echo "$CHECKS_OUTPUT" | grep -q "no checks reported"; then break; fi
            sleep 10
          done
          echo "$CHECKS_OUTPUT"
          if echo "$CHECKS_OUTPUT" | grep -q "no checks reported"; then
            echo "[FAIL] Timed out waiting for required checks."
            exit 1
          fi
          gh pr checks "$PR_URL" --watch --fail-fast
          echo "PR created successfully. Manual approval remains required before merge."

      - name: Publish build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automatic-country-resume-variants
          path: dist/resumes/
          if-no-files-found: error
          retention-days: 30
