name: Build Global Resume Variants

on:
  push:
    branches: [main]
    paths:
      - 'Resume_Hazvinei_Masiya.md'
      - 'scripts/build-resume-variants.py'
      - 'resume-variants/**'
      - '.github/workflows/build-global-resume-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate country/application variants
        run: python3 scripts/build-resume-variants.py

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Build PDFs
        run: |
          mkdir -p dist/resumes/pdf
          for file in dist/resumes/*.md; do
            libreoffice --headless --convert-to pdf --outdir dist/resumes/pdf "$file"
          done

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-resume-variants
          path: dist/resumes/
          if-no-files-found: error
          retention-days: 30
