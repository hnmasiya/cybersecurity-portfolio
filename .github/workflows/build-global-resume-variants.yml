name: Build Global Resume Variants

on:
  push:
    branches: [main]
    paths:
      - 'Resume_Hazvinei_Masiya.md'
      - 'scripts/build-resume-variants.py'
      - 'resume-variants/**'
      - '.github/workflows/build-global-resume-variants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate country/application variants
        run: python3 scripts/build-resume-variants.py

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Build PDFs
        run: |
          rm -rf dist/resumes/pdf
          mkdir -p dist/resumes/pdf
          for file in dist/resumes/*.md; do
            libreoffice --headless --convert-to pdf --outdir dist/resumes/pdf "$file"
          done

      - name: Publish PDFs to portfolio
        run: |
          set -e
          mkdir -p resume-variants/pdf
          cp dist/resumes/pdf/*.pdf resume-variants/pdf/
          git config user.name "Hazvinei Nomatter Masiya"
          git config user.email "norman.masiya@gmail.com"
          git add resume-variants/pdf/*.pdf
          if git diff --cached --quiet; then
            echo "No resume PDF changes to publish."
            exit 0
          fi
          git commit -m "auto: publish global resume variants"
          git push origin main

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-resume-variants
          path: dist/resumes/
          if-no-files-found: error
          retention-days: 30
